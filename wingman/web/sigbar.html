<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wingman sig bar</title>
  <link rel="stylesheet" href="style.css">
  <!-- The bar is a page of its own, not a route of index.html: it must
       outlive the main window's size and chrome. style.css is linked for
       the token block and the .evestat rules it already carries, so the
       bar's typography is BY CONSTRUCTION the status strip's rather than
       a hand-kept copy of it. The rules below only size the page and
       apply the user's stored background; no colour is decided here. -->
  <style>
    html, body {
      /* overflow hidden, not the page's scrollbars: a frameless window
         has no chrome to scroll with. */
      overflow: hidden;
      background: transparent;
    }
    body {
      /* Measured by sigbar.js after every render and pushed back through
         fit_sig_bar, so the window hugs its text in BOTH axes and the
         width is never a Python-side guess about font metrics. The
         padding is the drop shadow's room: box-shadow paints outside the
         element but never enters scrollWidth, so without margin of its
         own the overflow:hidden window would crop the shadow to a hard
         square edge -- the very thing the rounded shell exists to lose.
         scrollWidth/scrollHeight include the padding, so the fit
         round-trip still measures the true footprint. */
      width: max-content;
      padding: 8px;
      /* The drag surface is the whole bar: nothing on it is clickable, so
         easy_drag=False plus one full-body region is honest (the sibling
         note in index.html's titlebar explains why buttons and drag
         regions must not nest). */
      cursor: default;
    }
    .statusbar {
      /* The strip is a page here, not a footer: no border-top, no flex
         grow, and the padding is the whole visual. flex (not inline-flex):
         an inline box drags the body's line-height into the measured
         height, and fit_sig_bar would size the window a few pixels too
         tall. */
      border-top: none;
      display: flex;
      width: max-content;
      padding: 6px 12px;
      /* A floating card, not a strip torn off the main window: the same
         border/gradient/radius/shadow treatment as the fleet telemetry
         window's .fleet-shell (fleetbar.html), so the two floats read as
         siblings. The shell is opaque behind its text -- the full-opacity
         text invariant is untouched; only the page OUTSIDE the radius is
         transparent, which is what makes the corners look rounded. */
      border: 1px solid var(--control-border);
      border-radius: var(--radius-sm);
      background: linear-gradient(180deg, var(--card-top), var(--panel) 78%);
      box-shadow: 0 8px 24px var(--titlebar-edge);
    }
    /* style.css hides .evestat below a 720px viewport -- a rule for the
       MAIN window's narrow floor, which this bar NEVER exceeds. Without
       this override the bar's only content is display:none at every size
       it can have: the page measures its own padding (24x12), fit_sig_bar
       sizes the window to that, and the user sees an empty sliver they can
       only defeat by widening past a threshold no bar should have. */
    .statusbar .evestat { display: flex; }
    .evestat {
      flex: 0 0 auto;
      overflow: visible;
      /* Full opacity text is the invariant the window alpha cannot be
         allowed to break; .evelabel/.evestat children carry no opacity of
         their own, and .degraded only steps between text TOKENS. */
    }
  </style>
</head>
<body>
  <!-- Same segment, same ids-in-spirit as index.html's #evestat. Ids are
       NOT shared verbatim: this page has no #eve-warn and no engine-state
       line -- those belong to the full app, and a bar that flashes a
       warning glyph nobody can click to is worse than one that shows only
       what it can show. Never hidden: an empty floating pill is worse
       than a row of placeholders, and a stable row keeps the bar's
       width from jumping when the engine starts and stops. -->
  <!-- The drag region is .statusbar, NOT body: pywebview's mousedown walk
       climbs from the click target and stops AT body without ever testing
       it, so a region on body can never match -- and every pixel of this
       window is covered by .statusbar and its children. Same shape as the
       main window's titlebar, which has shipped for years. -->
  <div class="statusbar pywebview-drag-region">
    <span class="evestat" id="sigbar-stat">
      <span class="evelabel">SIG</span><span id="bar-sig">&mdash;</span>
      <span class="evelabel">ROOT</span><span id="bar-root">&mdash;</span>
      <span class="evelabel">NEXT</span><span id="bar-next">&mdash;</span>
    </span>
  </div>
  <script src="sigbar.js"></script>
</body>
</html>
