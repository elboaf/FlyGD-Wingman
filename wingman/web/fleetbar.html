<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wingman Fleet Bar</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      overflow: hidden;
      background: transparent;
    }
    [hidden] { display: none !important; }
    body {
      width: 420px;
      cursor: default;
      user-select: none;
    }
    .fleet-shell {
      display: block;
      width: 420px;
      height: max-content;
      flex: none;
      overflow: hidden;
      border: 1px solid var(--control-border);
      border-radius: var(--radius-sm);
      background: linear-gradient(180deg, var(--card-top), var(--panel) 78%);
      box-shadow: 0 8px 24px var(--titlebar-edge);
    }
    .fleet-title {
      /* Only the header drags: the roster must remain scrollable. Reset the
         main title bar's shared drag-region sizing for this standalone page. */
      height: auto;
      flex: none;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      min-height: 29px;
      padding: 7px 10px 6px;
      border-bottom: 1px solid var(--panel-border);
      color: var(--text-label);
      font-size: var(--fs-label);
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .fleet-health {
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: var(--fs-label);
      font-weight: 400;
      letter-spacing: .04em;
    }
    .fleet-health.warn { color: var(--warn); }
    .fleet-health.err { color: var(--err); }
    .fleet-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 160px 148px;
      align-items: center;
    }
    .fleet-table {
      max-height: 480px;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }
    .fleet-table:focus-visible {
      /* Keep the ring inside the overflow-clipped shell. */
      outline: 2px solid var(--focus-ring);
      outline-offset: -2px;
    }
    .fleet-head {
      position: sticky;
      top: 0;
      z-index: 1;
      min-height: 24px;
      padding: 0 10px;
      background: var(--sunken);
      border-bottom: 1px solid var(--row-line);
      color: var(--text-faint);
      font-size: var(--fs-label);
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .fleet-head span:nth-child(3) { text-align: right; }
    .fleet-row {
      min-height: 30px;
      padding: 0 10px;
      border-bottom: 1px solid var(--row-line);
      color: var(--text);
      font-size: var(--fs-body);
    }
    .fleet-row:last-child { border-bottom: 0; }
    .fleet-identity { min-width: 0; padding: 5px 0; }
    .fleet-remote {
      display: block;
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: var(--fs-label);
      /* Damage keeps both numeric tracks. Let the complete remote/stale
         label wrap within the remaining identity track, never over a value. */
      white-space: normal;
    }
    .fleet-character {
      display: block;
      overflow: hidden;
      padding-right: 10px;
      font-weight: 620;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .fleet-damage-head {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      height: 100%;
    }
    .fleet-damage-head-title { text-align: center; }
    .fleet-damage-head-sub {
      display: flex;
      justify-content: space-between;
    }
    .fleet-ewar {
      overflow: hidden;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: var(--fs-mono);
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .fleet-ewar.active { color: var(--warn); }
    /* The Damage cell: OUT half (value then a slim rail growing toward the
       axis) | fixed center axis | IN half (rail then value, mirrored). Both
       rails are anchored at the axis so a larger value visibly grows AWAY
       from center rather than the whole bar sliding -- transform-origin is
       the only thing that differs between the two halves. */
    .fleet-damage {
      display: flex;
      align-items: center;
      height: 100%;
      overflow: hidden;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: var(--fs-mono);
    }
    .fleet-damage.unavailable {
      justify-content: flex-end;
      color: var(--text-faint);
    }
    .fleet-damage-status {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .fleet-damage-out, .fleet-damage-in {
      display: flex;
      align-items: center;
      flex: 1 1 0;
      min-width: 0;
      gap: 5px;
    }
    .fleet-damage-out { justify-content: flex-start; }
    .fleet-damage-in { justify-content: flex-end; }
    .fleet-damage-value {
      flex: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .fleet-damage-track {
      flex: 1 1 auto;
      min-width: 10px;
      height: 3px;
      border-radius: 2px;
      background: var(--track);
      overflow: hidden;
    }
    .fleet-damage-fill {
      display: block;
      height: 100%;
      width: 100%;
      border-radius: 2px;
      background: var(--text-dim);
      transform: scaleX(0);
    }
    .fleet-damage-out .fleet-damage-fill { transform-origin: right center; }
    .fleet-damage-in .fleet-damage-fill { transform-origin: left center; }
    /* OUT never turns warm regardless of magnitude -- only positive IN and
       active EWAR share --warn. A positive OUT gets the brighter neutral
       --text instead, matching the pre-split ".fleet-dps.live" treatment. */
    .fleet-damage-out.live .fleet-damage-value,
    .fleet-damage-out.live .fleet-damage-fill { color: var(--text); }
    .fleet-damage-out.live .fleet-damage-fill { background: var(--text); }
    .fleet-damage-in.warn .fleet-damage-value,
    .fleet-damage-in.warn .fleet-damage-fill { color: var(--warn); }
    .fleet-damage-in.warn .fleet-damage-fill { background: var(--warn); }
    .fleet-damage-axis {
      flex: none;
      width: 1px;
      align-self: stretch;
      margin: 5px 6px;
      background: var(--row-line);
    }
    .fleet-empty, .fleet-note {
      color: var(--text-faint);
      font-size: var(--fs-muted);
    }
    .fleet-empty { padding: 11px 10px 12px; }
    .fleet-note {
      padding: 6px 10px 7px;
      border-top: 1px solid var(--panel-border);
      background: var(--sunken);
    }
    .fleet-note.err { color: var(--err); }
  </style>
</head>
<body>
  <section class="fleet-shell" aria-label="Fleet combat telemetry">
    <header class="fleet-title pywebview-drag-region">
      <span>Fleet telemetry</span>
      <span class="fleet-health" id="fleet-health">WAITING</span>
    </header>
    <div class="fleet-table" role="table" aria-label="Character damage and incoming EWAR" tabindex="0">
      <div class="fleet-grid fleet-head" role="row">
        <span role="columnheader">CHARACTER</span>
        <span class="fleet-damage-head" role="columnheader">
          <span class="fleet-damage-head-title" role="presentation">DAMAGE</span>
          <span class="fleet-damage-head-sub" role="presentation">
            <span role="presentation">OUT</span>
            <span role="presentation">IN</span>
          </span>
        </span>
        <span role="columnheader">EWAR</span>
      </div>
      <div id="fleet-rows" role="rowgroup"></div>
    </div>
    <div class="fleet-empty" id="fleet-empty" role="status">Waiting for EVE clients&hellip;</div>
    <div class="fleet-note" id="fleet-note" role="status" hidden></div>
  </section>
  <script src="dev.js"></script>
  <script src="fleetbar.js"></script>
</body>
</html>
