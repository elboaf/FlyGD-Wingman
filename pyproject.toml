# Declared explicitly rather than left to pip's implicit fallback. The
# SPDX `license` string below is PEP 639 and needs setuptools>=77; the
# fallback backend only guarantees >=40.8, so without this the build
# depends on whatever pip happens to resolve. build.yml:41 records what
# a silently-wrong install costs here.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The distribution/import name is deliberately unchanged by the FlyGD Wingman
# rename: it is baked into the %LOCALAPPDATA% state path, the PyInstaller
# entry point, and the release workflow's credential-injection step.
name = "obs-youtube-uploader"
# Derived from obs_youtube_uploader.__version__, not retyped. M2 found the
# version was carried by hand here AND in __init__.py, which is exactly the
# drift DESIGN.md's "State that must not be retyped" exists to stop -- and it
# started mattering the moment the page began showing the value to users.
# packaging/installer.iss is the one remaining hand-typed copy (Inno Pascal
# cannot import Python); ci.yml still asserts that pair agrees.
dynamic = ["version"]
description = "FlyGD Wingman - Windows companion for OBS recordings: review, stitch, and upload to YouTube."
readme = "README.md"
requires-python = ">=3.11"
maintainers = [{ name = "FlyGD", email = "technical@zoolanders.vip" }]
# GPL-3.0-only, not -or-later: the preview subsystem this project is
# growing derives from TriffView, which is v3-only. An "or later" grant
# here could not survive that combination, so it would be a claim we
# would have to retract later.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "pystray",
    # Kept, despite looking like Tk-era baggage: build_tray() opens the
    # bundled .ico with it and draws the generated fallback icon.
    "Pillow",
    # Pinned exactly, not ranged. 6.x has live API churn -- FOLDER_DIALOG
    # was deprecated for FileDialog.FOLDER mid-series -- and pywebview is a
    # small project whose frameless-Windows support is its thinnest area.
    # 6.2.1 is the version the spike ran on. Treat an upgrade as a change
    # requiring a full smoke pass, not a routine bump.
    "pywebview==6.2.1",
    # Already installed, transitively: google-auth 2.56.3 depends on it
    # unconditionally (uv.lock:382-387) and it is bundled into every
    # release today. Declaring it changes no resolution -- it is here so
    # that dropping or replacing the Google client libraries cannot
    # silently take the EVE SSO token verifier's RS256 dependency with
    # them. That failure would surface at authentication, not at install.
    "cryptography",
]

[project.urls]
Homepage = "https://wingman.zoolanders.vip/"
Issues = "https://github.com/elboaf/FlyGD-Wingman/issues"
Source = "https://github.com/elboaf/FlyGD-Wingman"
Releases = "https://github.com/elboaf/FlyGD-Wingman/releases"
"Privacy Policy" = "https://wingman.zoolanders.vip/privacy"
"Terms of Service" = "https://wingman.zoolanders.vip/terms"

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.4"]

[tool.setuptools]
# Declared explicitly rather than left to auto-discovery. `packaging/` holds
# build scripts, not an importable package, but setuptools' flat-layout
# discovery sees it (and `packaging/bin/` once ffmpeg is fetched) as
# additional top-level packages, hits the multiple-top-level-packages error,
# and aborts the install entirely. That failure took down every dependency
# and produced a frozen build with no pystray in it.
# Subpackages are NOT implied by their parent here: an explicit list means
# every new one must be added by hand, and a missing entry installs cleanly
# and fails at import time in the built artifact, not in the checkout where
# the source tree makes it work anyway.
packages = [
    "obs_youtube_uploader",
    "obs_youtube_uploader.ui",
    "obs_youtube_uploader.preview",
    "obs_youtube_uploader.evesettings",
    "obs_youtube_uploader.eveskills",
]

[tool.setuptools.dynamic]
# attr=, so the build reads the literal without importing the package --
# obs_youtube_uploader/__init__.py must stay import-light for this to hold,
# and today it is a single assignment.
version = { attr = "obs_youtube_uploader.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
# 88 is ruff's default and already this codebase's shape: the longest
# line in the tree is 104 characters. Raising the limit to 100 does not
# reduce the reformat at all -- 149 files change either way -- and it
# would rejoin deliberately wrapped user-facing message strings into
# 97-character lines.
line-length = 88
# packaging/ holds one-off build-time fetch scripts (AutoHotkey, ffmpeg,
# WebView2 runtime) that a separate task owns end to end, including their
# installer-version coupling. Linting them here would mix an unrelated
# diff into this task's hand-reviewed cleanup.
#
# *.md is excluded because ruff formats Python code fences inside markdown
# by default, and this repository keeps its design and plan documents at
# the root. Those are historical records of completed work: reformatting
# their code blocks rewrites what was written at the time without changing
# anything that runs. Left enabled it also doubled the reformat commit
# (9,655 markdown lines against 9,711 Python), and the "the suite still
# passes" argument that justifies a mechanical reformat has no purchase on
# prose. A plan's code blocks should be formatted when the plan is written,
# not retroactively.
extend-exclude = ["packaging", "*.md"]
# Exclusions above are applied during directory traversal but NOT to paths
# named explicitly on the command line, unless this is set. Without it,
# `ruff format somefile.md`, an editor's "Format Document", or any
# pre-commit hook (which passes filenames explicitly -- the case this
# option exists for) reformats the plan docs anyway, and `ruff format .`
# being safe hides that. Verified: with *.md excluded but force-exclude
# off, `ruff format --check *.md` still reformats 10 files.
force-exclude = true

[tool.ruff.lint]
select = [
    "I",      # import sorting
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "PIE",
    "FURB",
    "RUF",
    "BLE",    # blind except -- see below
    "DTZ",    # naive datetimes
    "S110",   # try-except-pass
    "S112",   # try-except-continue
]
ignore = [
    # The formatter owns line length. Selecting "E" pulls in E501, which
    # flags 84 lines here -- and `ruff format` CANNOT fix them, because it
    # will not split a long string or a comment. Leaving E501 enabled makes
    # the lint gate unsatisfiable without hand-rewrapping 84 sites for no
    # benefit the formatter does not already provide.
    "E501",
]
# Not selected, deliberately:
#   D    -- the docstrings here are unusually good and carry real
#           reasoning. A formal style gate would produce noise, not signal.
#   ANN  -- annotating 16k lines is its own project.
#   PL, C901 -- complexity thresholds would flag ui/api.py without
#           telling anyone something they do not already know.
#
# BLE001 is selected even though seventeen sites currently trip it.
# Fourteen `# noqa: BLE001` directives with reasons attached existed
# before ruff was adopted; eight of those survive, and six turned out to
# be unused and were removed by RUF100 (one in evesettings/names.py,
# five in ui/api.py -- their handlers log with exc_info=True, so BLE001
# never fired there). Nine were added when ruff was adopted. The
# convention pre-dates the linter; this makes it enforced. Every new
# suppression must state why the exception is swallowed.

[tool.ruff.lint.per-file-ignores]
# Tests legitimately bind values purely to assert on them later, and
# fixtures shadow imports by design.
"tests/*" = ["S110", "S112"]
