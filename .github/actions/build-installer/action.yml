# Shared Windows build chain for build.yml and release.yml.
#
# These two workflows previously carried ~500 duplicated lines and had
# already drifted apart: the app-icon verification existed only in
# build.yml, so the workflow producing throwaway artifacts was STRICTER
# than the one that ships to users. One definition makes that class of
# bug impossible rather than merely unlikely.
#
# Secrets are inputs here, never read via GitHub's secrets context directly.
# A composite action has no access to the calling repository's secrets;
# the caller must pass them.
name: Build installer
description: Fetch dependencies, freeze with PyInstaller, verify the bundle, and build the Inno Setup installer.

inputs:
  inject-credentials:
    description: 'Replace the OAuth placeholders in credentials.py. String "true" or "false", not a boolean — composite action inputs are always strings.'
    required: false
    default: "false"
  oauth-client-id:
    description: "OAuth client ID. Required when inject-credentials is true."
    required: false
    default: ""
  oauth-client-secret:
    description: "OAuth client secret. Required when inject-credentials is true."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Inno Setup
      # Not assumed present on the runner image. Needs 6.3+ because
      # installer.iss uses ArchitecturesInstallIn64BitMode=x64compatible.
      shell: pwsh
      run: choco install innosetup --no-progress -y

    - name: Install dependencies
      shell: pwsh
      run: |
        # $ErrorActionPreference alone does NOT catch a native command's
        # non-zero exit, and a multi-line run: block keeps going after one.
        # That is how a failed `pip install -e .` previously produced a
        # green step, no pystray in the environment, and a frozen app that
        # crashed on launch. Check every exit code explicitly.
        python -m pip install --upgrade pip
        if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
        python -m pip install -e .
        if ($LASTEXITCODE -ne 0) { throw "editable install failed - the app's dependencies are missing" }
        # Pinned: packaging/uploader.spec and packaging/installer.iss both
        # assume PyInstaller 6.x's one-folder layout (exe at the top of the
        # dist folder, dependencies under _internal/). Bumping this means
        # re-checking installer.iss's {app}\{#AppExe} assumption.
        python -m pip install "pyinstaller>=6,<7"
        if ($LASTEXITCODE -ne 0) { throw "pyinstaller install failed" }

    - name: Verify the app's dependencies are importable
      # PyInstaller only reports "Hidden import not found" as an ERROR line
      # and still exits 0, so a missing dependency yields a successful build
      # of a broken application. Fail here instead, where it is obvious.
      #
      # This only proves the packages are installed on the *build* runner,
      # before PyInstaller has run - it says nothing about whether the web/
      # page data actually reached the frozen bundle. See the post-build
      # assertion below for that.
      shell: pwsh
      run: |
        python -c "import pystray, PIL, googleapiclient, google_auth_oauthlib, webview; print('runtime deps importable')"
        if ($LASTEXITCODE -ne 0) { throw "the app's runtime dependencies are not installed" }
        # Checked separately because it is the hiddenimports= entry, not an
        # ordinary import: nothing in the source imports this module by
        # name, so a rename or a broken pythonnet install would otherwise
        # surface only as a frozen app that opens no window and exits 0
        # (spike Q7). Named on its own line so the failure says which one.
        python -c "import webview.platforms.edgechromium; print('edgechromium backend importable')"
        if ($LASTEXITCODE -ne 0) { throw "webview.platforms.edgechromium is not importable - the hiddenimports entry in uploader.spec would resolve to nothing and the frozen app would exit 0 with no window" }
        # Same silent-failure shape as edgechromium above, for the
        # TriffSkills port: eveskills/ is a plain package import, not a
        # hiddenimports entry, but a broken import here (a missing
        # dependency, a typo surviving a rename) would otherwise surface
        # only once the Skills route is opened in the frozen app, not
        # here where the failure is actually actionable.
        python -c "from obs_youtube_uploader.eveskills.controller import SkillsController; print('SkillsController importable')"
        if ($LASTEXITCODE -ne 0) { throw "obs_youtube_uploader.eveskills.controller.SkillsController is not importable - the Skills route would fail the moment it opens in the frozen app" }

    - name: Inject OAuth credentials
      if: ${{ inputs.inject-credentials == 'true' }}
      shell: pwsh
      env:
        OAUTH_CLIENT_ID: ${{ inputs.oauth-client-id }}
        OAUTH_CLIENT_SECRET: ${{ inputs.oauth-client-secret }}
      run: |
        if (-not $env:OAUTH_CLIENT_ID) { throw "inject_credentials was requested but OAUTH_CLIENT_ID is not set" }
        if (-not $env:OAUTH_CLIENT_SECRET) { throw "inject_credentials was requested but OAUTH_CLIENT_SECRET is not set" }
        $file = "obs_youtube_uploader/credentials.py"
        $content = Get-Content $file -Raw
        # Longest placeholder first: the secret's placeholder is a substring
        # of the client ID's, so the reverse order would corrupt the ID.
        $content = $content.Replace("REPLACE_AT_BUILD_TIME.apps.googleusercontent.com", $env:OAUTH_CLIENT_ID)
        $content = $content.Replace("REPLACE_AT_BUILD_TIME", $env:OAUTH_CLIENT_SECRET)
        Set-Content $file $content -NoNewline

    - name: Verify the injected credentials are well-formed
      if: ${{ inputs.inject-credentials == 'true' }}
      # The importability check above runs BEFORE injection, so nothing
      # validated credentials.py after it was rewritten. A secret carrying
      # a trailing space still produces a syntactically valid file that
      # builds green and is then rejected by Google at sign-in as "the
      # provided client secret is invalid" -- with no CI signal at all.
      #
      # Prints only shapes and lengths, never the values.
      shell: python
      run: |
        import sys
        from obs_youtube_uploader import credentials as c

        cfg = c.CLIENT_CONFIG["installed"]
        cid, sec = cfg["client_id"], cfg["client_secret"]
        bad = []

        if c.is_placeholder():
            bad.append("is_placeholder() is still True -- the replace did not take")
        if cid != cid.strip():
            bad.append("client_id has leading or trailing whitespace")
        if sec != sec.strip():
            bad.append("client_secret has leading or trailing whitespace")
        if not cid.endswith(".apps.googleusercontent.com"):
            bad.append("client_id does not end with .apps.googleusercontent.com")
        if chr(10) in cid or chr(10) in sec:
            bad.append("a value contains a newline")
        if not sec:
            bad.append("client_secret is empty")
        if " " in sec:
            # Observed for real: the stored secret was the text of a
            # `gh secret set ...` command rather than the value it was
            # meant to set. Google then rejects sign-in with "the provided
            # client secret is invalid" and nothing upstream notices,
            # because a shell command is a perfectly valid Python string.
            bad.append("client_secret contains a space -- it looks like a "
                       "command line or a pasted phrase, not a secret")
        if not sec.startswith("GOCSPX-"):
            # Google issues desktop-app secrets with this prefix. A value
            # without it is not necessarily wrong, but it has never been
            # right here, so fail loudly rather than ship it.
            bad.append("client_secret does not start with GOCSPX- , which "
                       "every Google desktop-app secret does")

        print("client_id: %d chars, ends %r" % (len(cid), cid[-30:]))
        print("client_secret: %d chars, starts %r" % (len(sec), sec[:7]))

        for b in bad:
            print("::error::" + b)
        sys.exit(1 if bad else 0)

    - name: Warn that credentials are placeholders
      if: ${{ inputs.inject-credentials != 'true' }}
      shell: pwsh
      run: echo "::warning::Built without OAuth credentials. Everything is testable except Connect Google Account, which will fail."

    - name: Fetch ffmpeg
      shell: pwsh
      run: python packaging/fetch_ffmpeg.py

    - name: Fetch the AutoHotkey interpreter
      shell: pwsh
      run: python packaging/fetch_autohotkey.py

    # No signature check for AutoHotkeyU64.exe: upstream v1.1 releases are
    # not Authenticode-signed (verified 2026-08-22, empty PE security
    # directory). The SHA256 pin in packaging/fetch_autohotkey.py is the
    # only integrity guarantee for this binary. Revisit if upstream starts
    # signing.

    - name: Fetch the WebView2 bootstrapper
      shell: pwsh
      run: python packaging/fetch_webview2.py

    - name: Verify the WebView2 bootstrapper is signed by Microsoft
      # This is the integrity gate, standing in for the sha256 pin
      # fetch_ffmpeg.py uses. A pin is not possible here: Microsoft rotates
      # the artifact behind a stable fwlink, so a pinned hash would break
      # the build every few weeks and train whoever maintains it to bump
      # hashes without checking them. Verifying the PUBLISHER is stronger
      # anyway, and it is the check that would actually catch a hijacked
      # redirect - which is the threat that matters when the file is
      # bundled into an installer and then Exec'd on a user's machine.
      # Needs Windows, which is why it lives here and not in the script.
      shell: pwsh
      run: |
        $stub = "packaging\bin\MicrosoftEdgeWebview2Setup.exe"
        if (-not (Test-Path $stub)) { throw "bootstrapper not found at $stub" }
        $sig = Get-AuthenticodeSignature $stub
        Write-Host "Status:  $($sig.Status)"
        Write-Host "Subject: $($sig.SignerCertificate.Subject)"
        if ($sig.Status -ne "Valid") {
          throw "WebView2 bootstrapper signature is $($sig.Status), not Valid - do NOT ship this"
        }
        if ($sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
          throw "WebView2 bootstrapper is signed by $($sig.SignerCertificate.Subject), not Microsoft Corporation"
        }

    - name: Build executable
      shell: pwsh
      run: python -m PyInstaller packaging/uploader.spec --noconfirm

    - name: Show what PyInstaller produced
      # The layout is the thing that cannot be verified off-Windows.
      # Confirmed on 2026-08-20 against PyInstaller 6.x: the executable sits
      # at the top of dist/OBSYouTubeUploader (so installer.iss's
      # {app}\{#AppExe} shortcut target is right) and everything else,
      # including the bundled bin/ffmpeg, goes under _internal/. At runtime
      # sys._MEIPASS points at _internal, so app.resolve_binary()'s
      # bundle_dir()/bin resolves to _internal/bin and matches.
      # Fails the build if the ffmpeg binaries are not where the app looks.
      shell: pwsh
      run: |
        Write-Host "--- dist/OBSYouTubeUploader ---"
        Get-ChildItem dist\OBSYouTubeUploader
        Write-Host "--- _internal/bin (where resolve_binary looks at runtime) ---"
        $bin = "dist\OBSYouTubeUploader\_internal\bin"
        if (-not (Test-Path $bin)) {
          throw "Bundled ffmpeg not found at $bin - resolve_binary() would fall back to PATH and stitching would be silently unavailable"
        }
        Get-ChildItem $bin
        foreach ($exe in @("ffmpeg.exe", "ffprobe.exe")) {
          if (-not (Test-Path (Join-Path $bin $exe))) { throw "$exe missing from the bundle" }
        }

    - name: Verify the preview label font is bundled
      # Same trap as web/ above: a `datas` entry that resolves to nothing
      # still exits 0. chrome.py degrades to Pillow's default face and
      # logs, so the build is green and the app runs -- with every preview
      # label in the wrong font.
      shell: pwsh
      run: |
        $font = "dist\OBSYouTubeUploader\_internal\assets\fonts\Inter-Regular.ttf"
        # -PathType Leaf: a DIRECTORY named Inter-Regular.ttf would
        # satisfy a bare Test-Path and Pillow cannot load one. That is
        # not hypothetical here -- fetch_autohotkey.py exists because a
        # datas entry once produced exactly that, a directory where a
        # file was expected.
        if (-not (Test-Path $font -PathType Leaf)) {
          throw "Inter-Regular.ttf not found at $font - the assets/fonts datas entry in uploader.spec did not resolve, and preview labels will silently render in Pillow's default face"
        }

    - name: Verify the web page is bundled
      # Mirrors the ffmpeg check above and exists for the same reason the
      # sv-ttk assertion it replaces did: PyInstaller exits 0 even when a
      # `datas` entry resolves to nothing, so a wrong path in uploader.spec
      # would produce a green build of an app that opens a blank window -
      # and nothing in CI would notice without this. The trap is confirmed
      # still live: the spike's build.ps1 asserts on exactly this path for
      # exactly this reason.
      #
      # It is worse here than it was for sv-ttk. A missing .tcl file raised
      # at set_theme(); a missing web/ produces no exception at all, because
      # pywebview swallows load failures (spike Q7) and webview.start()
      # returns normally with exit code 0.
      #
      # This assertion only proves the files are present; it cannot prove
      # the page loads and renders, which is what actually launching the app
      # (manually, from the downloaded artifact) is for - see
      # docs/smoke-checklist.md, "Look and feel > Frozen build".
      shell: pwsh
      run: |
        $web = "dist\OBSYouTubeUploader\_internal\web"
        if (-not (Test-Path $web)) {
          throw "web/ not found at $web - the (WEB, 'web') datas entry in uploader.spec did not resolve, and the app will open a blank window and exit 0"
        }
        Get-ChildItem -Recurse $web
        # Every file the page loads by name. index.html is the entry point;
        # a missing style.css or any of the scripts renders an unstyled or
        # inert page rather than failing. Settings is a ROUTE inside
        # index.html, so there is no second document to check.
        #
        # Deliberately no count: this said "the four scripts" while
        # listing five, because the number is not checked against
        # anything and nobody updates it when a file is added. The array
        # below is the list; the comment says what the list is for.
        foreach ($asset in @("index.html", "style.css", "app.js", "list.js", "panel.js", "settings.js", "skills.js", "firstrun.js",
                             "fonts/InterVariable.woff2", "fonts/JetBrainsMono-Regular.woff2")) {
          $path = Join-Path $web $asset
          if (-not (Test-Path $path)) { throw "$asset missing from the bundled web/ data at $path" }
        }
        # The fonts fail QUIETLY where the scripts fail loudly: a missing
        # woff2 renders the page in Segoe UI instead of Inter, which looks
        # deliberate rather than broken. The type scale asks for weights
        # 620 and 650, so the fallback silently flattens them into the
        # 600/700 buckets and nobody files a bug.

    - name: Verify the bookmark engine was collected
      # Same trap as the web/ check above, applied to the two-part v1.1
      # engine: uploader.spec collects the .ahk script as a `datas` entry
      # and the interpreter as a `binaries` entry, and PyInstaller exits 0
      # if either silently fails to land. paths.engine_script() and
      # paths.engine_exe() both refuse to fall back (the latter
      # deliberately does not search PATH, to avoid handing our v1 script
      # to a v2 interpreter), so a missing file here means the hotkey
      # feature never starts, with no error the user would see.
      #
      # -PathType Leaf: added while fixing the GPL-notices check below,
      # which found that a bare Test-Path also returns true for a
      # directory. Neither of these two paths is currently at risk of
      # that (nothing renames them through `datas`), but the assertion is
      # supposed to prove a *file* landed, and Leaf is what actually says
      # that.
      shell: pwsh
      run: |
        $script = "dist/OBSYouTubeUploader/_internal/engine/eve_bookmarks.ahk"
        if (-not (Test-Path $script -PathType Leaf)) {
          throw "engine script missing from the bundle - PyInstaller exits 0 when datas fail to collect"
        }
        $exe = "dist/OBSYouTubeUploader/_internal/bin/AutoHotkeyU64.exe"
        if (-not (Test-Path $exe -PathType Leaf)) { throw "AutoHotkey interpreter missing from the bundle" }

    - name: Verify the app icon is bundled
      # Same failure shape as the two checks above: uploader.spec lists the
      # icon as a `datas` entry, and PyInstaller exits 0 even when such an
      # entry resolves to nothing. paths.icon_file() would then return None
      # at runtime and every window would silently fall back to the default
      # Tk feather - a green build of a visibly wrong app.
      shell: pwsh
      run: |
        $icon = "dist\OBSYouTubeUploader\_internal\app.ico"
        if (-not (Test-Path $icon)) {
          throw "app.ico not found at $icon - the (ICON, '.') datas entry in uploader.spec did not resolve, and paths.icon_file() will find nothing at runtime"
        }
        Get-Item $icon

    - name: Verify the GPL notices are bundled
      # Same silent-datas-failure shape as the checks above, but the
      # consequence here is legal rather than functional: the app would
      # still run fine with these three files missing, which is exactly
      # why a build-time assertion is the only thing that would catch it.
      # These three are what THIRD-PARTY-NOTICES.md's written offer
      # depends on actually installing them beside the binaries.
      #
      # -PathType Leaf, not a bare Test-Path: uploader.spec's `datas`
      # entries name a destination *directory*, so a rename attempted
      # there (rather than at fetch time, where these three are actually
      # renamed) would create a directory named e.g.
      # "ffmpeg-COPYING.txt" containing the real file -- and a bare
      # Test-Path returns true for that directory just as readily as for
      # a file, defeating the whole point of this check.
      shell: pwsh
      run: |
        $root = "dist\OBSYouTubeUploader\_internal"
        foreach ($file in @("THIRD-PARTY-NOTICES.md", "AutoHotkey-COPYING.txt", "ffmpeg-COPYING.txt")) {
          $path = Join-Path $root $file
          if (-not (Test-Path $path -PathType Leaf)) {
            throw "$file not found at $path - the corresponding datas entry in uploader.spec did not resolve, and the shipped installer would omit a GPL-required licence text or the written offer of source"
          }
        }

    - name: Build installer
      shell: pwsh
      run: iscc packaging/installer.iss
