# .github/workflows/release.yml
name: Release
on:
  push:
    tags: ["v*"]

# GITHUB_TOKEN defaults to read-only on repositories configured after early
# 2023, so the publish step gets "403 Resource not accessible by integration"
# when it tries to create the release. Declared here rather than left to the
# repository's Actions setting, so the workflow works on a fresh clone or a
# fork without anyone having to change a setting they will not think to look
# for. contents: write is the minimum needed to create a release and upload
# assets; nothing here needs any other scope.
#
# Empty at workflow level and granted per job, so any job added later starts
# from the read-only default rather than silently inheriting write.
permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        # windows-latest is not guaranteed to ship Inno Setup. installer.iss
        # uses ArchitecturesInstallIn64BitMode=x64compatible, a setting value
        # introduced in Inno Setup 6.3 -- an older iscc would fail to compile.
        # Chocolatey's innosetup package is current enough (6.3+) as of this
        # writing.
        run: choco install innosetup --no-progress -y

      - name: Install dependencies
        shell: pwsh
        run: |
          # Exit codes checked explicitly: a multi-line run: block on Windows
          # keeps going after a native command fails, so a dead
          # `pip install -e .` would otherwise leave a green step, no runtime
          # dependencies, and a frozen app that crashes on launch.
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "editable install failed - the app's dependencies are missing" }
          # Pinned: the PyInstaller spec and installer.iss both assume 6.x's
          # one-folder layout (executable at the top of dist/, dependencies
          # under _internal/). A 7.x release with a changed layout would
          # produce an installer whose shortcuts point at nothing while the
          # build still reports success. If you bump this, re-check
          # packaging/installer.iss's {app}\{#AppExe} assumption at the same
          # time.
          python -m pip install "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "pyinstaller install failed" }

      - name: Verify the app's dependencies are importable
        # PyInstaller reports a missing hidden import as an ERROR line but
        # still exits 0, so a missing dependency yields a successful build of
        # a broken application. Fail here, where the cause is obvious.
        shell: pwsh
        run: |
          python -c "import pystray, PIL, googleapiclient, google_auth_oauthlib; print('runtime deps importable')"
          if ($LASTEXITCODE -ne 0) { throw "the app's runtime dependencies are not installed" }

      - name: Inject OAuth credentials
        shell: pwsh
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          if (-not $env:OAUTH_CLIENT_ID) { throw "OAUTH_CLIENT_ID secret is not set" }
          if (-not $env:OAUTH_CLIENT_SECRET) { throw "OAUTH_CLIENT_SECRET secret is not set" }
          $file = "obs_youtube_uploader/credentials.py"
          $content = Get-Content $file -Raw
          $content = $content.Replace("REPLACE_AT_BUILD_TIME.apps.googleusercontent.com", $env:OAUTH_CLIENT_ID)
          $content = $content.Replace("REPLACE_AT_BUILD_TIME", $env:OAUTH_CLIENT_SECRET)
          Set-Content $file $content -NoNewline

      - name: Fetch ffmpeg
        run: python packaging/fetch_ffmpeg.py

      - name: Build executable
        run: python -m PyInstaller packaging/uploader.spec --noconfirm

      - name: Build installer
        run: iscc packaging/installer.iss

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FlyGD-Wingman-Setup-*.exe
          # The OAuth app is PUBLISHED (production), not merely in testing,
          # so anyone can sign in -- the earlier prerelease guard assumed
          # testing mode, where non-testers hit a hard 403. That is not the
          # state we are in. What remains is verification, which only costs
          # users a click-through warning.
          prerelease: false
          body: |
            [FlyGD Wingman](https://wingman.zoolanders.vip/) — your OBS
            recording wingman. Watches your OBS recording folder, and uploads
            the recordings you select to your own YouTube channel.

            **Google hasn't verified the app yet.** You can sign in, but the
            consent screen shows a "Google hasn't verified this app"
            warning — click **Advanced** then **Go to FlyGD Wingman
            (unsafe)** to continue.

            Windows will show a "Windows protected your PC" warning because
            the installer is unsigned. Click **More info** then **Run anyway**.

            [Privacy Policy](https://wingman.zoolanders.vip/privacy) ·
            [Terms of Service](https://wingman.zoolanders.vip/terms)
