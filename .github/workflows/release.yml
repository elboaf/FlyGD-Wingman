# .github/workflows/release.yml
name: Release
on:
  push:
    tags: ["v*"]

# GITHUB_TOKEN defaults to read-only on repositories configured after early
# 2023, so the publish step gets "403 Resource not accessible by integration"
# when it tries to create the release. Declared here rather than left to the
# repository's Actions setting, so the workflow works on a fresh clone or a
# fork without anyone having to change a setting they will not think to look
# for. contents: write is the minimum needed to create a release and upload
# assets; nothing here needs any other scope.
#
# Empty at workflow level and granted per job, so any job added later starts
# from the read-only default rather than silently inheriting write.
permissions: {}

jobs:
  # The release path ran no tests at all before this job existed. ci.yml
  # triggers on `push: branches` and `pull_request`; a tag push matches
  # neither, so `git tag v3.2.2 && git push --tags` built an installer and
  # published a release without a single test having run.
  #
  # windows-latest: this ships a Windows app, and the suite is now green
  # there (Task 3). It ran on ubuntu-latest until then, deliberately, so
  # this gate would not go red before Windows compatibility was fixed.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - name: Install
        # --locked, not --frozen: --locked fails if uv.lock disagrees with
        # pyproject.toml, which is the whole point. --frozen would install
        # a stale lockfile silently.
        run: uv sync --locked --extra dev
      - name: Test
        run: uv run --no-sync python -m pytest tests/ -v

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - uses: ./.github/actions/build-installer
        with:
          # Always true for a release: shipping an installer that cannot
          # sign in is worse than not shipping. The action throws if the
          # secrets are absent.
          inject-credentials: "true"
          oauth-client-id: ${{ secrets.OAUTH_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.OAUTH_CLIENT_SECRET }}

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: dist/FlyGD-Wingman-Setup-*.exe
          # The OAuth app is PUBLISHED (production) and Google-verified,
          # so anyone can sign in with no warning interstitial.
          prerelease: false
          # Until this line, a release body was the static blurb below and
          # nothing else: the notes never said what changed in the version
          # being downloaded. GitHub builds the list from the titles of the
          # PRs merged since the previous release, which in this repo are
          # already written as prose sentences, and appends a compare link.
          # Nothing has to be maintained by hand for that to work, which is
          # why there is no CHANGELOG.md to keep in sync.
          #
          # `body` below is pre-pended to the generated notes rather than
          # replaced, so the unsigned-installer warning stays at the top
          # where someone about to download needs to read it.
          #
          # The range is measured from the previous *release*, not the
          # previous tag. A tag pushed without a release being created would
          # silently make the next release's list span two versions.
          generate_release_notes: true
          body: |
            [FlyGD Wingman](https://wingman.zoolanders.vip/) — your OBS
            recording wingman. Watches your OBS recording folder, and uploads
            the recordings you select to your own YouTube channel.

            Windows will show a "Windows protected your PC" warning because
            the installer is unsigned. Click **More info** then **Run anyway**.

            [Privacy Policy](https://wingman.zoolanders.vip/privacy) ·
            [Terms of Service](https://wingman.zoolanders.vip/terms)
