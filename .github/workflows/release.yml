# .github/workflows/release.yml
name: Release
on:
  push:
    tags: ["v*"]

# GITHUB_TOKEN defaults to read-only on repositories configured after early
# 2023, so the publish step gets "403 Resource not accessible by integration"
# when it tries to create the release. Declared here rather than left to the
# repository's Actions setting, so the workflow works on a fresh clone or a
# fork without anyone having to change a setting they will not think to look
# for. contents: write is the minimum needed to create a release and upload
# assets; nothing here needs any other scope.
#
# Empty at workflow level and granted per job, so any job added later starts
# from the read-only default rather than silently inheriting write.
permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        # windows-latest is not guaranteed to ship Inno Setup. installer.iss
        # uses ArchitecturesInstallIn64BitMode=x64compatible, a setting value
        # introduced in Inno Setup 6.3 -- an older iscc would fail to compile.
        # Chocolatey's innosetup package is current enough (6.3+) as of this
        # writing.
        run: choco install innosetup --no-progress -y

      - name: Install dependencies
        shell: pwsh
        run: |
          # Exit codes checked explicitly: a multi-line run: block on Windows
          # keeps going after a native command fails, so a dead
          # `pip install -e .` would otherwise leave a green step, no runtime
          # dependencies, and a frozen app that crashes on launch.
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "editable install failed - the app's dependencies are missing" }
          # Pinned: the PyInstaller spec and installer.iss both assume 6.x's
          # one-folder layout (executable at the top of dist/, dependencies
          # under _internal/). A 7.x release with a changed layout would
          # produce an installer whose shortcuts point at nothing while the
          # build still reports success. If you bump this, re-check
          # packaging/installer.iss's {app}\{#AppExe} assumption at the same
          # time.
          python -m pip install "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "pyinstaller install failed" }

      - name: Verify the app's dependencies are importable
        # PyInstaller reports a missing hidden import as an ERROR line but
        # still exits 0, so a missing dependency yields a successful build of
        # a broken application. Fail here, where the cause is obvious.
        #
        # webview is checked here even though this list historically lagged
        # build.yml's: the release path must not be weaker than the test-build
        # path, and this is the dependency whose absence produces the quietest
        # failure of any of them (spike Q7 - no window, no error, exit 0).
        shell: pwsh
        run: |
          python -c "import pystray, PIL, googleapiclient, google_auth_oauthlib, webview; print('runtime deps importable')"
          if ($LASTEXITCODE -ne 0) { throw "the app's runtime dependencies are not installed" }
          # The hiddenimports= entry, checked separately so the failure names
          # it. Nothing imports this module by name, so PyInstaller dropping
          # it is invisible until a user launches the release.
          python -c "import webview.platforms.edgechromium; print('edgechromium backend importable')"
          if ($LASTEXITCODE -ne 0) { throw "webview.platforms.edgechromium is not importable - the hiddenimports entry in uploader.spec would resolve to nothing and the released app would exit 0 with no window" }

      - name: Inject OAuth credentials
        shell: pwsh
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          if (-not $env:OAUTH_CLIENT_ID) { throw "OAUTH_CLIENT_ID secret is not set" }
          if (-not $env:OAUTH_CLIENT_SECRET) { throw "OAUTH_CLIENT_SECRET secret is not set" }
          $file = "obs_youtube_uploader/credentials.py"
          $content = Get-Content $file -Raw
          $content = $content.Replace("REPLACE_AT_BUILD_TIME.apps.googleusercontent.com", $env:OAUTH_CLIENT_ID)
          $content = $content.Replace("REPLACE_AT_BUILD_TIME", $env:OAUTH_CLIENT_SECRET)
          Set-Content $file $content -NoNewline

      - name: Verify the injected credentials are well-formed
        # The importability check above runs BEFORE injection, so nothing
        # validated credentials.py after it was rewritten. A secret carrying
        # a trailing space still produces a syntactically valid file that
        # builds green and is then rejected by Google at sign-in as "the
        # provided client secret is invalid" -- with no CI signal at all.
        # A release must never ship that.
        #
        # Prints only shapes and lengths, never the values.
        shell: python
        run: |
          import sys
          from obs_youtube_uploader import credentials as c

          cfg = c.CLIENT_CONFIG["installed"]
          cid, sec = cfg["client_id"], cfg["client_secret"]
          bad = []

          if c.is_placeholder():
              bad.append("is_placeholder() is still True -- the replace did not take")
          if cid != cid.strip():
              bad.append("client_id has leading or trailing whitespace")
          if sec != sec.strip():
              bad.append("client_secret has leading or trailing whitespace")
          if not cid.endswith(".apps.googleusercontent.com"):
              bad.append("client_id does not end with .apps.googleusercontent.com")
          if chr(10) in cid or chr(10) in sec:
              bad.append("a value contains a newline")
          if not sec:
              bad.append("client_secret is empty")
          if " " in sec:
              # Observed for real: the stored secret was the text of a
              # `gh secret set ...` command rather than the value it was
              # meant to set. Google then rejects sign-in with "the provided
              # client secret is invalid" and nothing upstream notices,
              # because a shell command is a perfectly valid Python string.
              bad.append("client_secret contains a space -- it looks like a "
                         "command line or a pasted phrase, not a secret")
          if not sec.startswith("GOCSPX-"):
              # Google issues desktop-app secrets with this prefix. A value
              # without it is not necessarily wrong, but it has never been
              # right here, so fail loudly rather than ship it.
              bad.append("client_secret does not start with GOCSPX- , which "
                         "every Google desktop-app secret does")

          print("client_id: %d chars, ends %r" % (len(cid), cid[-30:]))
          print("client_secret: %d chars, starts %r" % (len(sec), sec[:7]))

          for b in bad:
              print("::error::" + b)
          sys.exit(1 if bad else 0)

      - name: Fetch ffmpeg
        run: python packaging/fetch_ffmpeg.py

      - name: Fetch the WebView2 bootstrapper
        run: python packaging/fetch_webview2.py

      - name: Verify the WebView2 bootstrapper is signed by Microsoft
        # This is the integrity gate, standing in for the sha256 pin
        # fetch_ffmpeg.py uses. A pin is not possible here: Microsoft rotates
        # the artifact behind a stable fwlink, so a pinned hash would break
        # the build every few weeks and train whoever maintains it to bump
        # hashes without checking them. Verifying the PUBLISHER is stronger
        # anyway, and it is the check that would actually catch a hijacked
        # redirect - which is the threat that matters when the file is
        # bundled into an installer and then Exec'd on a user's machine.
        # Needs Windows, which is why it lives here and not in the script.
        #
        # It matters more here than in build.yml: this artifact is bundled
        # into a RELEASED installer and then Exec'd on every machine that
        # installs it, so an unverified stub here is a supply-chain problem,
        # not just a broken test build. If you change one of the two steps
        # (this one or build.yml's), change the other.
        shell: pwsh
        run: |
          $stub = "packaging\bin\MicrosoftEdgeWebview2Setup.exe"
          if (-not (Test-Path $stub)) { throw "bootstrapper not found at $stub" }
          $sig = Get-AuthenticodeSignature $stub
          Write-Host "Status:  $($sig.Status)"
          Write-Host "Subject: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") {
            throw "WebView2 bootstrapper signature is $($sig.Status), not Valid - do NOT ship this"
          }
          if ($sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
            throw "WebView2 bootstrapper is signed by $($sig.SignerCertificate.Subject), not Microsoft Corporation"
          }

      - name: Build executable
        run: python -m PyInstaller packaging/uploader.spec --noconfirm

      - name: Verify the web page is bundled
        # release.yml previously had NO post-build bundle assertion of any
        # kind - build.yml carried them all, and a release built straight from
        # a tag skipped every one. That was survivable while the worst
        # outcome was an unthemed window. It is not survivable now: a `datas`
        # entry that resolves to nothing still leaves PyInstaller exiting 0,
        # and the resulting app opens no window and exits 0 as well (spike
        # Q7), so the first report would come from a user who downloaded a
        # release and saw nothing happen.
        #
        # Deliberately mirrors build.yml's step of the same name. If you
        # change one, change the other - they are the same assertion on the
        # same path, and the release path must not be the weaker of the two.
        shell: pwsh
        run: |
          $web = "dist\OBSYouTubeUploader\_internal\web"
          if (-not (Test-Path $web)) {
            throw "web/ not found at $web - the (WEB, 'web') datas entry in uploader.spec did not resolve, and the released app will open a blank window and exit 0"
          }
          Get-ChildItem -Recurse $web
          foreach ($asset in @("index.html", "style.css", "app.js", "list.js", "panel.js", "settings.js", "firstrun.js",
                               "fonts/InterVariable.woff2", "fonts/JetBrainsMono-Regular.woff2")) {
            $path = Join-Path $web $asset
            if (-not (Test-Path $path)) { throw "$asset missing from the bundled web/ data at $path" }
          }
          # The fonts fail QUIETLY where the scripts fail loudly: a missing
          # woff2 renders the page in Segoe UI instead of Inter, which looks
          # deliberate rather than broken. The type scale asks for weights
          # 620 and 650, so the fallback silently flattens them into the
          # 600/700 buckets and nobody files a bug.

      - name: Build installer
        run: iscc packaging/installer.iss

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FlyGD-Wingman-Setup-*.exe
          # The OAuth app is PUBLISHED (production) and Google-verified,
          # so anyone can sign in with no warning interstitial.
          prerelease: false
          body: |
            [FlyGD Wingman](https://wingman.zoolanders.vip/) — your OBS
            recording wingman. Watches your OBS recording folder, and uploads
            the recordings you select to your own YouTube channel.

            Windows will show a "Windows protected your PC" warning because
            the installer is unsigned. Click **More info** then **Run anyway**.

            [Privacy Policy](https://wingman.zoolanders.vip/privacy) ·
            [Terms of Service](https://wingman.zoolanders.vip/terms)
