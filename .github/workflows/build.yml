# .github/workflows/build.yml
#
# Manual test build. Produces a real installer as a downloadable artifact
# without publishing a release, so the Windows build chain — PyInstaller and
# Inno Setup, neither of which can run on the Linux dev machine — can actually
# be exercised before tagging anything.
#
# Credential injection is OPTIONAL here, unlike release.yml where a missing
# secret is a hard failure. With secrets set the installer can sign in for
# real; without them it still builds and installs, and everything except
# "Connect Google Account" is testable.
name: Test build
on:
  workflow_dispatch:
    inputs:
      inject_credentials:
        description: "Inject OAuth credentials from repository secrets (requires OAUTH_CLIENT_ID and OAUTH_CLIENT_SECRET)"
        type: boolean
        default: false

jobs:
  test:
    # windows-latest: this ships a Windows app, and the suite is now
    # green there (Task 3). It ran on ubuntu-latest until then,
    # deliberately, so this job would not go red before Windows
    # compatibility was fixed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - name: Install
        # --locked, not --frozen: --locked fails if uv.lock disagrees with
        # pyproject.toml, which is the whole point. --frozen would install
        # a stale lockfile silently.
        run: uv sync --locked --extra dev
      - name: Test
        run: uv run --no-sync python -m pytest tests/ -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - uses: ./.github/actions/build-installer
        with:
          # Optional here, unlike release.yml: without secrets the
          # installer still builds and installs, and everything except
          # "Connect Google Account" is testable.
          inject-credentials: ${{ inputs.inject_credentials }}
          oauth-client-id: ${{ secrets.OAUTH_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.OAUTH_CLIENT_SECRET }}

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: FlyGD-Wingman-installer
          path: dist/FlyGD-Wingman-Setup-*.exe
          if-no-files-found: error

      - name: Upload unpacked build
        # Useful when the installer works but the app does not: lets you run
        # the exe directly and see whether the problem is packaging or code.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: FlyGD-Wingman-unpacked
          path: dist/OBSYouTubeUploader/
          if-no-files-found: error
