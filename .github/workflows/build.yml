# .github/workflows/build.yml
#
# Manual test build. Produces a real installer as a downloadable artifact
# without publishing a release, so the Windows build chain — PyInstaller and
# Inno Setup, neither of which can run on the Linux dev machine — can actually
# be exercised before tagging anything.
#
# Credential injection is OPTIONAL here, unlike release.yml where a missing
# secret is a hard failure. With secrets set the installer can sign in for
# real; without them it still builds and installs, and everything except
# "Connect Google Account" is testable.
name: Test build
on:
  workflow_dispatch:
    inputs:
      inject_credentials:
        description: "Inject OAuth credentials from repository secrets (requires OAUTH_CLIENT_ID and OAUTH_CLIENT_SECRET)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        # Not assumed present on the runner image. Needs 6.3+ because
        # installer.iss uses ArchitecturesInstallIn64BitMode=x64compatible.
        run: choco install innosetup --no-progress -y

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          # $ErrorActionPreference alone does NOT catch a native command's
          # non-zero exit, and a multi-line run: block keeps going after one.
          # That is how a failed `pip install -e .` previously produced a
          # green step, no pystray in the environment, and a frozen app that
          # crashed on launch. Check every exit code explicitly.
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "editable install failed - the app's dependencies are missing" }
          # Pinned: packaging/uploader.spec and packaging/installer.iss both
          # assume PyInstaller 6.x's one-folder layout (exe at the top of the
          # dist folder, dependencies under _internal/). Bumping this means
          # re-checking installer.iss's {app}\{#AppExe} assumption.
          python -m pip install "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "pyinstaller install failed" }

      - name: Verify the app's dependencies are importable
        # PyInstaller only reports "Hidden import not found" as an ERROR line
        # and still exits 0, so a missing dependency yields a successful build
        # of a broken application. Fail here instead, where it is obvious.
        #
        # This only proves sv_ttk is installed on the *build* runner, before
        # PyInstaller has run - it says nothing about whether the .tcl data
        # actually reached the frozen bundle. See the post-build assertion
        # below for that.
        shell: pwsh
        run: |
          python -c "import pystray, PIL, googleapiclient, google_auth_oauthlib, sv_ttk; print('runtime deps importable')"
          if ($LASTEXITCODE -ne 0) { throw "the app's runtime dependencies are not installed" }

      - name: Inject OAuth credentials
        if: ${{ inputs.inject_credentials }}
        shell: pwsh
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          if (-not $env:OAUTH_CLIENT_ID) { throw "inject_credentials was requested but OAUTH_CLIENT_ID is not set" }
          if (-not $env:OAUTH_CLIENT_SECRET) { throw "inject_credentials was requested but OAUTH_CLIENT_SECRET is not set" }
          $file = "obs_youtube_uploader/credentials.py"
          $content = Get-Content $file -Raw
          # Longest placeholder first: the secret's placeholder is a substring
          # of the client ID's, so the reverse order would corrupt the ID.
          $content = $content.Replace("REPLACE_AT_BUILD_TIME.apps.googleusercontent.com", $env:OAUTH_CLIENT_ID)
          $content = $content.Replace("REPLACE_AT_BUILD_TIME", $env:OAUTH_CLIENT_SECRET)
          Set-Content $file $content -NoNewline

      - name: Warn that credentials are placeholders
        if: ${{ !inputs.inject_credentials }}
        run: echo "::warning::Built without OAuth credentials. Everything is testable except Connect Google Account, which will fail."

      - name: Fetch ffmpeg
        run: python packaging/fetch_ffmpeg.py

      - name: Build executable
        run: python -m PyInstaller packaging/uploader.spec --noconfirm

      - name: Show what PyInstaller produced
        # The layout is the thing that cannot be verified off-Windows.
        # Confirmed on 2026-08-20 against PyInstaller 6.x: the executable sits
        # at the top of dist/OBSYouTubeUploader (so installer.iss's
        # {app}\{#AppExe} shortcut target is right) and everything else,
        # including the bundled bin/ffmpeg, goes under _internal/. At runtime
        # sys._MEIPASS points at _internal, so app.resolve_binary()'s
        # bundle_dir()/bin resolves to _internal/bin and matches.
        # Fails the build if the ffmpeg binaries are not where the app looks.
        shell: pwsh
        run: |
          Write-Host "--- dist/OBSYouTubeUploader ---"
          Get-ChildItem dist\OBSYouTubeUploader
          Write-Host "--- _internal/bin (where resolve_binary looks at runtime) ---"
          $bin = "dist\OBSYouTubeUploader\_internal\bin"
          if (-not (Test-Path $bin)) {
            throw "Bundled ffmpeg not found at $bin - resolve_binary() would fall back to PATH and stitching would be silently unavailable"
          }
          Get-ChildItem $bin
          foreach ($exe in @("ffmpeg.exe", "ffprobe.exe")) {
            if (-not (Test-Path (Join-Path $bin $exe))) { throw "$exe missing from the bundle" }
          }

      - name: Build installer
        run: iscc packaging/installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OBS-YouTube-Uploader-installer
          path: dist/OBS-YouTube-Uploader-Setup-*.exe
          if-no-files-found: error

      - name: Upload unpacked build
        # Useful when the installer works but the app does not: lets you run
        # the exe directly and see whether the problem is packaging or code.
        uses: actions/upload-artifact@v4
        with:
          name: OBS-YouTube-Uploader-unpacked
          path: dist/OBSYouTubeUploader/
          if-no-files-found: error
