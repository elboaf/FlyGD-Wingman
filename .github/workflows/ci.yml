# .github/workflows/ci.yml
name: CI
on:
  push:
    branches: ["**"]
  pull_request:

# A push to a busy branch cancels its own superseded runs. Scoped by ref
# so unrelated branches never cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Text assertions over files. No reason to pay for these twice.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      # The version-consistency check that stood here is gone, and its
      # absence is deliberate. It compared three hand-typed copies of the
      # version; there are now none. pyproject.toml derives from
      # wingman/__init__.py through setuptools' dynamic
      # metadata, uv.lock stopped recording one as a consequence, and
      # packaging/installer.iss #includes a version.iss generated from the
      # same source immediately before iscc runs.
      #
      # What replaced it is tests/test_packaging_version.py, which asserts
      # the derivation chain itself rather than that N literals agree. It
      # runs on both platforms in the job below, which the bash check did
      # not. Do not reinstate a grep for `^version = ` in pyproject.toml --
      # it is not there any more, and adding it back would mean adding the
      # literal back too.
      - name: Check the WebView2 detection predicate agrees
        # The installer decides whether to run the Evergreen bootstrapper and
        # the app decides whether to refuse to start, and they must be the
        # same question. They cannot share code -- one is Inno Pascal, the
        # other is Python -- so this asserts on the pieces that would silently
        # drift: the EdgeUpdate client GUID, the registry subkey, the value
        # name, and the 0.0.0.0 sentinel. A drift here means the installer
        # skips the bootstrapper on a machine the app then refuses to run on,
        # or vice versa, and nothing else in the pipeline would notice.
        run: |
          python - <<'PY'
          import pathlib, sys

          iss = pathlib.Path("packaging/installer.iss").read_text()
          py = pathlib.Path("wingman/ui/preflight.py").read_text()

          tokens = {
              "EdgeUpdate client GUID": "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
              "registry subkey": r"SOFTWARE\Microsoft\EdgeUpdate\Clients",
              "value name": "pv",
              "empty-install sentinel": "0.0.0.0",
          }
          missing = []
          for label, token in tokens.items():
              if token not in iss:
                  missing.append(f"{label} ({token!r}) missing from packaging/installer.iss")
              if token not in py:
                  missing.append(f"{label} ({token!r}) missing from wingman/ui/preflight.py")

          if missing:
              for line in missing:
                  print(f"::error::{line}")
              print("The installer's WebView2RuntimePresent() and preflight.py's")
              print("webview2_version() must be the same predicate.")
              sys.exit(1)
          print("WebView2 detection predicate agrees across installer.iss and preflight.py")
          PY
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - name: Lint
        # The pinned ruff from [project.optional-dependencies] dev, not
        # ruff-action's own copy: a version skew between CI and a
        # contributor's machine turns "lint is green locally" into a
        # coin flip.
        run: |
          uv sync --locked --extra dev
          uv run --extra dev ruff check --output-format github

      - name: Format
        # Without this the 136-file reformat decays from the first pull
        # request that lands unformatted, and re-running it later costs
        # the same churn all over again. --diff prints exactly what
        # differs, so a failure tells the contributor what to run rather
        # than only that something is wrong.
        #
        # No `uv sync` here: the Lint step above already synced, and both
        # steps run in the same job on the same runner.
        run: uv run --extra dev ruff format --check --diff

      - name: Check the build action always goes through uv run
        # `uv sync` installs into .venv, which a bare `python` does not
        # see. A step in build-installer that drops its `uv run` prefix
        # runs against setup-python's interpreter, which has none of the
        # app's dependencies -- and that does NOT fail loudly. It produces
        # a confusing import error, or an app frozen without its
        # dependencies from a green build. build.yml's own comments record
        # that shipping once.
        #
        # This was a manual grep someone had to remember during review.
        # A protection nobody runs is not a protection, and this whole
        # effort is about turning silent failures into loud ones.
        #
        # A few packaging/ scripts are the deliberate exception, and the
        # CRITERION is what matters rather than the count: stdlib-only, so
        # there is nothing in .venv they could want, and invoked as a bare
        # `python packaging/....py`. They are excluded by name so the
        # exception stays explicit -- a new bare `python` fails this check
        # rather than quietly joining them, which is exactly what happened
        # when write_version_iss.py was added and is why it is listed here
        # deliberately rather than by accident.
        #
        # Before adding a name below, check the script imports nothing
        # third-party. tests/test_packaging_version.py asserts that for
        # every name in this list, by parsing this file -- so a script
        # allowlisted here that grows a `requests` import fails the suite
        # rather than the release build.
        # Two forms count as a bypass and the pattern must catch both: an
        # indented `python ...` inside a `run: |` block, and a single-line
        # `run: python ...`. An earlier version of this check only matched
        # the first, which made it cosmetic -- a deliberately injected
        # `run: python -c ...` sailed straight through it.
        run: |
          offenders=$(grep -nE '^[[:space:]]+(python|pyinstaller)\b|run:[[:space:]]*(python|pyinstaller)\b' \
              .github/actions/build-installer/action.yml \
              | grep -vE 'python packaging/(fetch_ffmpeg|fetch_autohotkey|fetch_webview2|write_version_iss|settings-codec/collect_licenses)\.py' \
              || true)
          if [ -n "$offenders" ]; then
            echo "::error::A step in build-installer/action.yml bypasses 'uv run'."
            echo "It will use setup-python's interpreter, which has none of the app's dependencies."
            echo "$offenders"
            exit 1
          fi
          echo "every Python invocation in the build action goes through uv run"

  test:
    # windows-latest is not redundant with ubuntu. Seven modules bind
    # windll/winreg, and tests/test_preview_win32.py -- which asserts every
    # user32/gdi32/dwmapi symbol the app binds actually resolves -- is
    # skipif'd off every other platform. Before this matrix it had never
    # executed anywhere, including the WSL dev machine.
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure must not cancel the other's run. Knowing
      # whether a failure is Windows-specific or universal is the whole
      # point of the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - name: Install
        # --locked, not --frozen: --locked fails if uv.lock disagrees with
        # pyproject.toml, which is the whole point. --frozen would install
        # a stale lockfile silently.
        run: uv sync --locked --extra dev
      - name: Test
        run: uv run --no-sync python -m pytest tests/ -v
